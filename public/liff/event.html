<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이벤트 생성</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFFFFF;
      color: #111111;
      padding: 24px 20px;
      padding-bottom: 40px;
    }
    .header { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: #999999; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field-label { font-size: 14px; font-weight: 600; color: #333333; margin-bottom: 8px; }
    .text-input, .date-input {
      width: 100%; padding: 14px 16px; font-size: 16px;
      border: 1.5px solid #E0E0E0; border-radius: 10px;
      background: #FAFAFA; color: #111111;
      -webkit-appearance: none; appearance: none;
    }
    .text-input:focus, .date-input:focus {
      outline: none; border-color: #111111; background: #FFFFFF;
    }
    .text-input::placeholder { color: #CCCCCC; }
    .date-row { display: flex; gap: 10px; }
    .date-row .date-input { flex: 1; }
    .date-sep { display: flex; align-items: center; font-size: 14px; color: #999; padding-top: 0; }

    /* 상품 선택 */
    .prize-section { margin-bottom: 16px; }
    .product-carousel {
      display: flex; gap: 8px; overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 4px 0 8px;
    }
    .product-carousel::-webkit-scrollbar { display: none; }
    .product-card {
      flex: 0 0 114px; scroll-snap-align: start;
      border: 1.5px solid #E0E0E0; border-radius: 8px;
      overflow: hidden; cursor: pointer; background: transparent;
      transition: border-color 0.15s;
    }
    .product-card:active { opacity: 0.8; }
    .product-card.selected { border-color: #111111; }
    .product-card .thumb {
      width: 100%; height: 100px; object-fit: cover;
      display: block; background: #F0F0F0;
    }
    .product-card .info {
      padding: 6px 8px 8px;
    }
    .product-card .name {
      font-size: 12px; color: #111; font-weight: 600;
      line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .product-card .price {
      font-size: 12px; color: #999; font-weight: 700; margin-top: 2px;
    }
    .product-card .check {
      display: none; position: absolute; top: 6px; right: 6px;
      width: 22px; height: 22px; border-radius: 11px;
      background: #111111; color: #FFFFFF; font-size: 12px; font-weight: bold;
      align-items: center; justify-content: center;
    }
    .product-card.selected .check { display: flex; }
    .product-card { position: relative; }
    .loading-products { padding: 20px; text-align: center; font-size: 13px; color: #999; }

    .btn-create {
      width: 100%; padding: 16px; font-size: 16px; font-weight: 700;
      color: #FFFFFF; background: #111111; border: none; border-radius: 10px;
      cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
    }
    .btn-create:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-create:active:not(:disabled) { opacity: 0.7; }
    .status { text-align: center; margin-top: 16px; font-size: 14px; min-height: 20px; }
    .status.error { color: #FF3B30; }

    .loading { display: none; text-align: center; padding: 40px 0; }
    .loading.show { display: block; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid #E0E0E0;
      border-top-color: #111111; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .success-view { display: none; text-align: center; padding: 40px 0; }
    .success-view.show { display: block; }
    .success-icon {
      width: 56px; height: 56px; border-radius: 28px; background: #A5FF05;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; font-size: 24px;
    }
    .success-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .success-desc { font-size: 14px; color: #999999; }
    .debug { margin-top: 12px; font-size: 11px; color: #CCCCCC; text-align: center; word-break: break-all; }
  </style>
</head>
<body>
  <div id="form-view">
    <div class="header">이벤트 생성</div>
    <div class="subtitle">하루 페이스 랭킹 이벤트를 만들어보세요</div>

    <div class="field">
      <div class="field-label">이벤트 이름</div>
      <input type="text" id="eventName" class="text-input" placeholder="예: 3월 스피드 데이" maxlength="30">
    </div>

    <div class="field">
      <div class="field-label">이벤트 기간</div>
      <div class="date-row">
        <input type="date" id="eventDate" class="date-input">
        <div class="date-sep">~</div>
        <input type="date" id="eventEndDate" class="date-input">
      </div>
    </div>

    <div class="field prize-section">
      <div class="field-label">상품 선택 (선택)</div>
      <div class="product-carousel" id="productList">
        <div class="loading-products" id="productsLoading">상품 불러오는 중...</div>
      </div>
    </div>

    <button id="btnCreate" class="btn-create" disabled>이벤트 만들기</button>
    <div id="status" class="status"></div>
    <div id="debug" class="debug"></div>
  </div>

  <div id="loading-view" class="loading">
    <div class="spinner"></div>
    <div style="font-size:14px;color:#999">생성 중...</div>
  </div>

  <div id="success-view" class="success-view">
    <div class="success-icon">✓</div>
    <div class="success-title">이벤트가 생성되었습니다!</div>
    <div class="success-desc" id="successDate"></div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = '__LIFF_ID__';
    let liffContext = null;
    let liffProfile = null;
    let selectedProduct = null;
    let productsLoaded = false;

    const nameInput = document.getElementById('eventName');
    const dateInput = document.getElementById('eventDate');
    const endDateInput = document.getElementById('eventEndDate');
    const btnCreate = document.getElementById('btnCreate');
    const statusEl = document.getElementById('status');
    const debugEl = document.getElementById('debug');
    const formView = document.getElementById('form-view');
    const loadingView = document.getElementById('loading-view');
    const successView = document.getElementById('success-view');
    const productListEl = document.getElementById('productList');

    // 오늘 이후 날짜만
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const todayStr = `${yyyy}-${mm}-${dd}`;
    dateInput.min = todayStr;
    dateInput.value = todayStr;
    endDateInput.min = todayStr;
    endDateInput.value = todayStr;

    function checkForm() {
      btnCreate.disabled = !nameInput.value.trim() || !dateInput.value || !endDateInput.value || !selectedProduct;
    }

    dateInput.addEventListener('change', () => {
      if (endDateInput.value < dateInput.value) endDateInput.value = dateInput.value;
      endDateInput.min = dateInput.value;
      checkForm();
    });
    endDateInput.addEventListener('change', checkForm);
    nameInput.addEventListener('input', checkForm);
    checkForm();

    // 상품 목록
    async function loadProducts() {
      if (productsLoaded) return;
      try {
        const res = await fetch('/api/gifts/products?brand=10000340');
        const data = await res.json();
        if (data.ok && data.products.length > 0) {
          renderProducts(data.products);
        } else {
          document.getElementById('productsLoading').textContent = '상품을 불러올 수 없습니다';
        }
      } catch (e) {
        document.getElementById('productsLoading').textContent = '네트워크 오류';
      }
      productsLoaded = true;
    }

    function renderProducts(products) {
      productListEl.innerHTML = '';

      products.forEach((p) => {
        const card = document.createElement('div');
        const isSelected = selectedProduct && selectedProduct.id === p.id;
        card.className = 'product-card' + (isSelected ? ' selected' : '');

        const thumbHtml = p.imageUrl
          ? `<img class="thumb" src="${p.imageUrl}" alt="">`
          : `<div class="thumb"></div>`;

        card.innerHTML = `
          <div class="check">✓</div>
          ${thumbHtml}
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="price">$${p.price}</div>
          </div>
        `;
        card.onclick = () => {
          // 토글: 같은 상품 다시 누르면 해제
          if (selectedProduct && selectedProduct.id === p.id) {
            selectProduct(null, products);
          } else {
            selectProduct(p, products);
          }
        };
        productListEl.appendChild(card);
      });
    }

    function selectProduct(product, products) {
      selectedProduct = product;
      renderProducts(products);
      checkForm();
    }

    // 서버에서 주입한 실제 groupId (봇 webhook의 groupId)
    const SERVER_GROUP_ID = '__GROUP_ID__';
    const urlGroupId = SERVER_GROUP_ID || null;

    // LIFF 초기화
    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        liffContext = liff.getContext();
        liffProfile = await liff.getProfile();
        const gid = urlGroupId || liffContext?.groupId || liffContext?.roomId || 'none';
        const src = urlGroupId ? 'url' : (liffContext?.groupId ? 'ctx' : 'none');
        debugEl.textContent = `[${src}] gid: ${gid.substring(0, 12)}... | search: ${window.location.search.substring(0, 50)}`;
      } catch (err) {
        statusEl.textContent = 'LIFF 초기화 실패';
        statusEl.className = 'status error';
      }
    }

    // 이벤트 생성
    btnCreate.addEventListener('click', async () => {
      const eventDate = dateInput.value;
      const eventEndDate = endDateInput.value;
      if (!eventDate || !eventEndDate) return;

      const groupId = urlGroupId || liffContext?.groupId || liffContext?.roomId;
      if (!groupId) {
        statusEl.textContent = '그룹 채팅방에서 열어주세요';
        statusEl.className = 'status error';
        debugEl.textContent = `context: ${JSON.stringify(liffContext?.type || null)}`;
        return;
      }

      const userId = liffProfile?.userId;
      if (!userId) {
        statusEl.textContent = '로그인이 필요합니다';
        statusEl.className = 'status error';
        return;
      }

      formView.style.display = 'none';
      loadingView.classList.add('show');

      try {
        const body = {
          groupId, eventDate, eventEndDate, userId,
          eventName: nameInput.value.trim() || null,
          prizeInfo: selectedProduct ? selectedProduct.name : null,
          prizeProductId: selectedProduct ? selectedProduct.id : null,
          prizePrice: selectedProduct ? selectedProduct.price : null,
        };

        const res = await fetch('/api/event/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const data = await res.json();

        if (!res.ok) {
          loadingView.classList.remove('show');
          formView.style.display = 'block';
          statusEl.textContent = data.error || '이벤트 생성 실패';
          statusEl.className = 'status error';
          return;
        }

        loadingView.classList.remove('show');
        const period = eventDate === eventEndDate ? eventDate : `${eventDate} ~ ${eventEndDate}`;
        const desc = nameInput.value.trim() ? `${nameInput.value.trim()} — ${period}` : period;
        document.getElementById('successDate').textContent = desc;
        successView.classList.add('show');

        setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 1500);
      } catch (err) {
        loadingView.classList.remove('show');
        formView.style.display = 'block';
        statusEl.textContent = '네트워크 오류';
        statusEl.className = 'status error';
      }
    });

    initLiff();
    loadProducts();
  </script>
</body>
</html>
