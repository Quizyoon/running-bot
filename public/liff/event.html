<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이벤트 생성</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFFFFF;
      color: #111111;
      padding: 24px 20px;
      min-height: 100vh;
    }
    .header {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 14px;
      color: #999999;
      margin-bottom: 24px;
    }
    .field-label {
      font-size: 14px;
      font-weight: 600;
      color: #333333;
      margin-bottom: 8px;
    }
    .date-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1.5px solid #E0E0E0;
      border-radius: 10px;
      background: #FAFAFA;
      color: #111111;
      -webkit-appearance: none;
      appearance: none;
    }
    .date-input:focus {
      outline: none;
      border-color: #111111;
      background: #FFFFFF;
    }
    .btn-create {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      background: #111111;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 24px;
      transition: opacity 0.2s;
    }
    .btn-create:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .btn-create:active:not(:disabled) {
      opacity: 0.7;
    }
    .status {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      min-height: 20px;
    }
    .status.error { color: #FF3B30; }
    .status.success { color: #34C759; }
    .loading {
      display: none;
      text-align: center;
      padding: 40px 0;
    }
    .loading.show { display: block; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #E0E0E0;
      border-top-color: #111111;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .success-view {
      display: none;
      text-align: center;
      padding: 40px 0;
    }
    .success-view.show { display: block; }
    .success-icon {
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: #A5FF05;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 24px;
    }
    .success-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .success-desc {
      font-size: 14px;
      color: #999999;
    }
  </style>
</head>
<body>
  <div id="form-view">
    <div class="header">이벤트 생성</div>
    <div class="subtitle">페이스 랭킹 이벤트 날짜를 선택하세요</div>

    <div class="field-label">이벤트 날짜</div>
    <input type="date" id="eventDate" class="date-input">

    <button id="btnCreate" class="btn-create" disabled>이벤트 만들기</button>
    <div id="status" class="status"></div>
  </div>

  <div id="loading-view" class="loading">
    <div class="spinner"></div>
    <div style="font-size:14px;color:#999">생성 중...</div>
  </div>

  <div id="success-view" class="success-view">
    <div class="success-icon">✓</div>
    <div class="success-title">이벤트가 생성되었습니다!</div>
    <div class="success-desc" id="successDate"></div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = '__LIFF_ID__';
    let liffContext = null;
    let liffProfile = null;

    const dateInput = document.getElementById('eventDate');
    const btnCreate = document.getElementById('btnCreate');
    const statusEl = document.getElementById('status');
    const formView = document.getElementById('form-view');
    const loadingView = document.getElementById('loading-view');
    const successView = document.getElementById('success-view');

    // 오늘 이후 날짜만 선택 가능
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    dateInput.min = `${yyyy}-${mm}-${dd}`;
    dateInput.value = `${yyyy}-${mm}-${dd}`;
    btnCreate.disabled = false;

    dateInput.addEventListener('change', () => {
      btnCreate.disabled = !dateInput.value;
      statusEl.textContent = '';
      statusEl.className = 'status';
    });

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        liffContext = liff.getContext();
        liffProfile = await liff.getProfile();
      } catch (err) {
        console.error('LIFF init error:', err);
        statusEl.textContent = 'LIFF 초기화 실패';
        statusEl.className = 'status error';
      }
    }

    btnCreate.addEventListener('click', async () => {
      const eventDate = dateInput.value;
      if (!eventDate) return;

      // groupId 확인
      const groupId = liffContext?.groupId || liffContext?.roomId;
      if (!groupId) {
        statusEl.textContent = '그룹 채팅방에서 열어주세요';
        statusEl.className = 'status error';
        return;
      }

      const userId = liffProfile?.userId;
      if (!userId) {
        statusEl.textContent = '로그인이 필요합니다';
        statusEl.className = 'status error';
        return;
      }

      // 로딩 표시
      formView.style.display = 'none';
      loadingView.classList.add('show');

      try {
        const res = await fetch('/api/event/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ groupId, eventDate, userId }),
        });

        const data = await res.json();

        if (!res.ok) {
          loadingView.classList.remove('show');
          formView.style.display = 'block';
          statusEl.textContent = data.error || '이벤트 생성 실패';
          statusEl.className = 'status error';
          return;
        }

        // 성공
        loadingView.classList.remove('show');
        document.getElementById('successDate').textContent = eventDate;
        successView.classList.add('show');

        // 1.5초 후 LIFF 닫기
        setTimeout(() => {
          if (liff.isInClient()) {
            liff.closeWindow();
          }
        }, 1500);
      } catch (err) {
        loadingView.classList.remove('show');
        formView.style.display = 'block';
        statusEl.textContent = '네트워크 오류';
        statusEl.className = 'status error';
      }
    });

    initLiff();
  </script>
</body>
</html>
